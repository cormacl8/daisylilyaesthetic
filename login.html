<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Log In · Daisy-Lily</title>
<link rel="stylesheet" href="style.css">
<style>
.form-section { padding: 12px 18px 60px; max-width: 580px; margin: 0 auto; }

.form-footer { text-align: center; font-size: 13px; margin-top: 6px; }
.form-footer a { color: var(--mauve); text-decoration: none; font-weight: 500; }
.form-footer a:hover { text-decoration: underline; }

.keep-logged {
  display: flex; align-items: center; gap: 10px;
  font-size: 13.5px; margin-bottom: 22px; cursor: pointer;
}
.keep-logged input { accent-color: var(--mauve); width: 16px; height: 16px; flex-shrink: 0; }

/* password visibility toggle */
.input-wrap { position: relative; }
.input-wrap input { padding-right: 48px; }
.show-pw {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: var(--rose); font-size: 18px; line-height: 1; padding: 0;
  transition: color .15s;
}
.show-pw:hover { color: var(--mauve); }

.forgot-link {
  text-align: right; font-size: 12px; margin-top: -12px; margin-bottom: 20px;
}
.forgot-link a { color: var(--mauve); text-decoration: none; }
.forgot-link a:hover { text-decoration: underline; }

/* welcome back pill */
.welcome-pill {
  display: flex; align-items: center; gap: 10px;
  background: var(--petal); border-radius: var(--radius-pill);
  padding: 10px 18px; margin-bottom: 26px; width: fit-content; margin-left: auto; margin-right: auto;
}
.welcome-pill img {
  width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
  border: 1.5px solid var(--rose);
}
.welcome-pill span { font-size: 13px; color: var(--plum); }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo-wrap" href="index.html">
      <img class="nav-logo" src="https://cdn.nearcut.com/P3DWJY/logo_Daisy_Lily.jpg" alt="Daisy-Lily">
      <span class="nav-brand">Daisy‑Lily</span>
    </a>
    <div class="nav-links">
      <a href="gallery.html">Gallery</a>
      <a href="register.html">Register</a>
      <a class="nav-cta" href="book.html">Book</a>
    </div>
  </div>
</nav>

<!-- HEADER -->
<div class="page-header blob-container">
  <div class="blob blob-tr" style="opacity:.35;"></div>
  <div class="blob-content">
    <p class="page-eyebrow">Welcome Back</p>
    <h1 class="page-title"><em>Log In</em></h1>
    <p class="page-sub">Access your bookings and account details.</p>
  </div>
</div>

<!-- FORM -->
<div class="form-section">
  <div class="card">

    <div class="welcome-pill">
      <img src="https://cdn.nearcut.com/P3DWJY/logo_Daisy_Lily.jpg" alt="">
      <span>Daisy-Lily Member Login</span>
    </div>

    <form action="https://daisylilyaestheticsandbeauty.bookinbeautiful.com/users/sign_in" method="post">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="user[email]" placeholder="hello@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="user[password]" placeholder="Your password" autocomplete="current-password">
          <button type="button" class="show-pw" onclick="togglePw()" title="Show/hide password">👁</button>
        </div>
      </div>

      <div class="forgot-link">
        <a href="https://daisylilyaestheticsandbeauty.bookinbeautiful.com/users/password/new">Forgot your password?</a>
      </div>

      <label class="keep-logged">
        <input type="checkbox" name="user[remember_me]" value="1">
        Keep me logged in
      </label>

      <button type="submit" class="btn btn-primary btn-pill">Log In</button>

    </form>

    <div class="divider mt-md"><span>New here?</span></div>

    <a class="btn btn-secondary" href="register.html">Create a free account →</a>

    <div class="form-footer mt-md">
      <a href="https://daisylilyaestheticsandbeauty.bookinbeautiful.com/users/confirmation/new">Didn't receive confirmation email?</a>
    </div>

  </div>
</div>

<!-- FOOTER -->
<footer class="site-footer">
  <span class="footer-name">Daisy-Lily Aesthetic &amp; Beauty Clinic</span>
  <a href="https://daisylilyaestheticsandbeauty.bookinbeautiful.com/privacy_policy">Privacy Policy</a>
  <span class="footer-sep">·</span>
  <a href="https://daisylilyaestheticsandbeauty.bookinbeautiful.com/cookie_policy">Cookie Policy</a>
  <span class="footer-sep">·</span>
  <a href="https://daisylilyaestheticsandbeauty.bookinbeautiful.com/terms_and_conditions">Terms</a>
</footer>

<script>
function togglePw() {
  const pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
